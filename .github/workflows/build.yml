name: Build

on:
  push:
    branches: [ master, sdl2 ]
  pull_request:
    branches: [ master, sdl2 ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install D compiler
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev acme
      - name: Build
        run: make all
      - name: Test
        run: make test
      - name: Upload player.bin
        uses: actions/upload-artifact@v4
        with:
          name: player-bin
          path: src/c64/player.bin

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install D compiler
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest
      - name: Install dependencies
        run: |
          brew install sdl2 acme
      - name: Build
        run: make -f Makefile.mac all
      - name: Test
        run: make -f Makefile.mac test
      - name: Package
        run: make -f Makefile.mac dist
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: CheeseCutter-macOS
          path: dist/*.dmg

  build-windows:
    needs: build-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download player.bin
        uses: actions/download-artifact@v4
        with:
          name: player-bin
          path: src/c64
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install D compiler
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest
      - name: Build
        shell: bash
        run: |
          chmod +x arch/build-windows.sh
          ./arch/build-windows.sh
      - name: Download SDL2 DLL
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3-win32-x64.zip -OutFile sdl2.zip
          Expand-Archive sdl2.zip -DestinationPath sdl2
          Copy-Item sdl2/SDL2.dll dist/
      - name: Test
        shell: bash
        run: |
          dist/ccutter.exe -h > /dev/null
          dist/ct2util.exe > /dev/null
      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: CheeseCutter-Windows
          path: |
            dist/*.exe
            dist/*.dll
            README.md
            LICENSE.md
            tunes/
